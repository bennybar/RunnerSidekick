# /etc/nginx/sites-available/runnersidekick.conf
# TLS termination for the API. Get the certificate first:  sudo certbot certonly --nginx -d runnersidekick.ibarak.org

# The request line without its query string ($uri, not $request): OAuth codes and states never land in the log
log_format rsk_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                       '"$http_user_agent" $request_time';
server {
    listen 80;
    server_name runnersidekick.ibarak.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name runnersidekick.ibarak.org;

    ssl_certificate     /etc/letsencrypt/live/runnersidekick.ibarak.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/runnersidekick.ibarak.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;
    # Don't log the Authorization header (no format here does), nor query strings (rsk_noquery above).
    access_log /var/log/nginx/runnersidekick.access.log rsk_noquery;

    location /v1/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Nothing else is served; FastAPI's /docs and /openapi.json stay private.
    location / { return 404; }
}
